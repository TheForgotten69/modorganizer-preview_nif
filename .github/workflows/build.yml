name: Build NIF Preview Plugin

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg
    steps:
      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Cache CMake fetched dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/${{ github.event.repository.name }}/.cache/fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-

      - name: Create cache directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\.cache\vcpkg"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\.cache\fetchcontent"

      - name: Build NIF Preview Plugin
        uses: ModOrganizer2/build-with-mob-action@master
        with:
          mo2-third-parties: libbsarch
          mo2-dependencies: DirectXTex cmake_common uibase

      - name: Extract version and set as environment variable
        id: get_version
        shell: pwsh
        run: |
          $filePath = "./build/${{ github.event.repository.name }}/src/PreviewNif.cpp"
          
          if (-Not (Test-Path -Path $filePath)) {
              Write-Error "File not found: $filePath"
              exit 1
          }
          
          $versionMatch = Select-String -Path $filePath -Pattern 'return\s*{\s*(\d+),\s*(\d+),\s*(\d+),'
          
          if ($versionMatch) {
              $major = $versionMatch.Matches[0].Groups[1].Value
              $minor = $versionMatch.Matches[0].Groups[2].Value
              $subminor = $versionMatch.Matches[0].Groups[3].Value

              $version = "$major.$minor.$subminor"

              Write-Output "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
              Write-Error "Version information not found."
              exit 1
          }

      - name: Upload Build
        run: |
          mkdir -p upload
          cp ./build/${{ github.event.repository.name }}/vsbuild/src/RelWithDebInfo/preview_nif.dll ./upload/preview_nif.dll
          cp -r ./build/${{ github.event.repository.name }}/data ./upload/data

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview_nif-${{ env.VERSION }}
          path: ./upload
